name: CodeQL Analysis
description: Initialize CodeQL and perform security analysis for a given language

inputs:
  language:
    required: true
    description: "Language to analyze (e.g. python, actions, javascript-typescript)"
  build-mode:
    required: false
    default: "none"
    description: "Build mode: none, autobuild, or manual"

runs:
  using: composite
  steps:
    - name: Initialize CodeQL
      uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4
      with:
        languages: ${{ inputs.language }}
        build-mode: ${{ inputs.build-mode }}

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4
      with:
        category: "/language:${{ inputs.language }}"
