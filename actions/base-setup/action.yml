name: Base Setup
description: Install Python, Poetry (with OS-keyed cache), just, graphviz (Linux), and project dependencies

inputs:
  python-version:
    required: false
    default: ""
    description: "Python version to use (defaults to minimum version from pyproject.toml)"
  poetry-version:
    required: false
    default: "pre-commit"
    description: >-
      Poetry version to install with pipx. The default "pre-commit" installs the
      version pinned by the poetry hook in .pre-commit-config.yaml, falling back
      to the latest Poetry when no such hook exists. Pass an explicit version to
      pin it, or an empty string to skip installing Poetry.

runs:
  using: composite
  steps:
    - name: Get default Python version
      id: get-python-version
      if: inputs.python-version == ''
      shell: bash
      run: |
        python3 -c "
        import tomllib, re
        with open('pyproject.toml', 'rb') as f:
            data = tomllib.load(f)
        req = data['project']['requires-python']
        m = re.search(r'[\d.]+', req)
        print('version=' + m.group())
        " >> $GITHUB_OUTPUT

    - name: Install Python
      uses: actions/setup-python@v7
      with:
        python-version: ${{ inputs.python-version || steps.get-python-version.outputs.version }}
        allow-prereleases: true

    - name: Resolve Poetry version
      id: resolve-poetry-version
      if: inputs.poetry-version == 'pre-commit'
      shell: bash
      run: |
        version=$(python3 "${{ github.action_path }}/get_poetry_version.py")
        echo "version=$version" >> "$GITHUB_OUTPUT"

    - name: Install Poetry
      if: inputs.poetry-version != ''
      shell: bash
      env:
        POETRY_VERSION: ${{ inputs.poetry-version }}
        RESOLVED_POETRY_VERSION: ${{ steps.resolve-poetry-version.outputs.version }}
      run: |
        if [ "$POETRY_VERSION" = "pre-commit" ]; then
          if [ -n "$RESOLVED_POETRY_VERSION" ]; then
            pipx install "poetry==$RESOLVED_POETRY_VERSION"
          else
            pipx install poetry
          fi
        else
          pipx install "poetry==$POETRY_VERSION"
        fi

    - name: Cache dependencies
      uses: actions/cache@v6
      with:
        path: ~/.cache/pypoetry/cache
        key: pypoetry-${{ runner.os }}-py${{ inputs.python-version }}-${{ github.job }}-${{ github.workflow }}-${{ hashFiles('**/poetry.lock') }}
        restore-keys: |
          pypoetry-${{ runner.os }}-py${{ inputs.python-version }}-${{ github.job }}-${{ github.workflow }}-
          pypoetry-${{ runner.os }}-py${{ inputs.python-version }}-

    - name: Install just
      if: hashFiles('justfile') != ''
      uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

    - name: Install dependencies
      if: hashFiles('justfile') != ''
      run: just install
      shell: bash
