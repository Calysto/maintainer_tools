name: Enforce PR label
description: Enforces that a PR has at least one required label, waiting briefly for one to be applied

inputs:
  required-labels:
    required: false
    default: "bug,enhancement,dependencies,maintenance,documentation"
    description: "Comma-separated labels, at least one of which the pull request must have"
  wait-seconds:
    required: false
    default: "60"
    description: "Seconds to wait before re-checking when no required label is present yet"
  attempts:
    required: false
    default: "2"
    description: "Number of times to check for a required label before failing"

runs:
  using: composite
  steps:
    - name: Enforce a required label
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        REQUIRED_LABELS: ${{ inputs.required-labels }}
        ATTEMPTS: ${{ inputs.attempts }}
        WAIT_SECONDS: ${{ inputs.wait-seconds }}
      run: |
        bash "${{ github.action_path }}/wait_for_label.sh" \
          "$PR_NUMBER" "$REQUIRED_LABELS" "$ATTEMPTS" "$WAIT_SECONDS"
