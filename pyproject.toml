[tool.poetry]
include = [{ path = "tests", format = "sdist" }]

[project]
name = "calysto-maintainer-tools"
version = "1.6.4.dev0"
description = "GitHub Actions and tools for Calysto packages"
authors = [{ name = "Calysto" }]
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Programming Language :: Python :: Free Threading",
]

[dependency-groups]
test = ["pytest>=8.0"]
# Split out so `dev` stays a homogeneous array (all table entries) — a mixed
# string/table array crashes Dependabot's Poetry resolver (toml-rb).
dev-extra = ["pre-commit>=3.0"]
dev = [{ include-group = "test" }, { include-group = "dev-extra" }]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
