version: 2
updates:
  - package-ecosystem: "github-actions"
    # "/" covers .github/workflows; the glob covers each composite action's
    # action.yml, which Dependabot does not find on its own.
    directories:
      - "/"
      - "/actions/*"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns:
          - "*"
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    # Security updates only; routine lock refreshes run in .github/workflows/lock-update.yml
    open-pull-requests-limit: 0
